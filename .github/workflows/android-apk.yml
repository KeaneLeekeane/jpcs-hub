name: Build Android APK

# Builds an installable APK of the JPCS HUB mobile app (Android and HarmonyOS
# devices that run Android apps) and attaches it to a GitHub Release.
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        # R8 code shrinking is turned off: it strips classes that the WebRTC
        # (video call) library loads at runtime and fails the build.
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=false
          -Pandroid.enableShrinkResourcesInReleaseBuilds=false

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk JPCS-HUB-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JPCS-HUB-android
          path: mobile/JPCS-HUB-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: JPCS HUB Android build ${{ github.run_number }}
          body: |
            Install on Android or HarmonyOS phones: download the APK below, open it, and allow "Install unknown apps" when asked.
          files: mobile/JPCS-HUB-${{ github.run_number }}.apk
