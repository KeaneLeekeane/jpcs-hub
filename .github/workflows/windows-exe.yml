name: Build Windows app (.exe)

# Builds the JPCS HUB Windows installer (Electron) and attaches it to a GitHub Release.
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: JPCS-HUB-windows
          path: desktop/dist/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: JPCS HUB Windows app build ${{ github.run_number }}
          body: |
            Windows installer for JPCS HUB. Download the .exe below and run it.
            If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer is not code-signed).
          files: desktop/dist/*.exe
